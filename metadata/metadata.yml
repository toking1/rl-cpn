metadata_version: 1
name: "rl-cpn: RL Edge-Cloud Simulator Research Extension"
description: >-
  rl-cpn is a research extension of the RL Edge-Cloud Simulator, built on the
  simulation foundation of Pancio-code/Simulator for reinforcement-learning-based
  edge-cloud task scheduling and energy management. It adds dynamic-alpha
  research, scenario contracts, experiment organization, Gamma-7 evaluation,
  runtime configuration, and standard statistics export. Reproducibility is
  organized across two branches: The main branch is the sole source of truth for
  simulation code, while data/experiments stores statistics, analysis scripts,
  figures, and registry records. Raw simulation data are kept outside the
  repository, and plotting reads only standard statistics tables.
