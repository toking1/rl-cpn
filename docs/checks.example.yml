name: Source checks
on: [push, pull_request]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python -m compileall -q . -x '/.venv/'
      - run: python -c "import run_simulation_d_sarsa_cloud; from pathlib import Path; from runtime_config import repo_root; assert repo_root() == Path.cwd()"
      - run: python run_experiments.py list
      - run: python run_experiments.py --dry-run
